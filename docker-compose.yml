services:
  mariadb:
    image: mariadb:11
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: afghan_commerce
      MYSQL_USER: admin
      MYSQL_PASSWORD: adminpass
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: build/Dockerfile.api
    ports:
      - "5000:5000"
    depends_on:
      - mariadb
      - redis
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__Default=Server=mariadb;Port=3306;Database=afghan_commerce;User=admin;Password=adminpass
      - Redis__ConnectionString=redis:6379

volumes:
  mariadb_data:
